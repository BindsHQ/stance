name: StanceShowcase
options:
  bundleIdPrefix: si.binds.stance
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  Stance:
    path: ../../../platforms/ios
targets:
  StanceShowcase:
    type: application
    platform: iOS
    sources: [StanceShowcase]
    dependencies:
      - package: Stance
        product: StanceUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.binds.stance.showcase
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Stance
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
  StanceShowcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StanceShowcaseUITests]
    dependencies:
      - target: StanceShowcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.binds.stance.showcase.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  StanceShowcase:
    build:
      targets:
        StanceShowcase: all
        StanceShowcaseUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [StanceShowcaseUITests]
