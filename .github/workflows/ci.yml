name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:exports
      - run: npm run check:snippets
      - run: npm run build:docs
      - run: npm run check:seo
      - name: Generated files are committed
        run: git diff --exit-code -- packages/react/src/components/index.ts

  react-18:
    name: React 18 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@18.3.1 react-dom@18.3.1 @types/react@18 @types/react-dom@18 -w @bindshq/stance-react
      - run: npm run build -w @bindshq/stance-tokens
      - run: npm run build -w @bindshq/stance-react
      - run: npm test -w @bindshq/stance-react
      - name: Built declarations type-check against @types/react 18
        run: npm run check:consumer

  browser-audit:
    name: Real-browser accessibility audit (axe, 3 themes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run build:docs
      - run: (PORT=4319 node scripts/serve-static.mjs &) && sleep 2 && node scripts/audit-site.mjs http://localhost:4319
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.json

  native-generated:
    name: Native generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:generate
      - run: git diff --exit-code -- platforms packages/tokens/generated packages/tokens/src/generated.ts

  ios:
    name: iOS (StanceUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tests on macOS
        run: swift test
        working-directory: platforms/ios
      - name: Root manifest resolves and builds
        run: swift build
      - name: Package tests on the iOS simulator
        working-directory: platforms/ios
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          xcodebuild test -scheme Stance-Package -destination "platform=iOS Simulator,name=$DEVICE" -quiet

  android:
    name: Android (Stance for Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Library tests, lint and release build
        working-directory: platforms/android
        run: ./gradlew :stance-tokens:test :stance-compose:testDebugUnitTest :stance-compose:lintDebug :stance-compose:assembleRelease
      - name: Showcase builds and its tests pass
        working-directory: examples/android/StanceShowcase
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
