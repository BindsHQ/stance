name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:exports
      - run: npm run check:snippets
      - run: npm run build:docs
      - name: Generated files are committed
        run: git diff --exit-code -- packages/react/src/components/index.ts

  react-18:
    name: React 18 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@18.3.1 react-dom@18.3.1 @types/react@18 @types/react-dom@18 -w @bindshq/stance-react
      - run: npm run build -w @bindshq/stance-tokens
      - run: npm test -w @bindshq/stance-react

  browser-audit:
    name: Real-browser accessibility audit (axe, 3 themes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run build:docs
      - run: (PORT=4319 node scripts/serve-static.mjs &) && sleep 2 && node scripts/audit-site.mjs http://localhost:4319
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.json
